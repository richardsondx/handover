server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /guide { try_files /guide.html =404; }
    location = /guide/ { try_files /guide.html =404; }
    location = /field-kit { try_files /field-kit.html =404; }
    location = /field-kit/ { try_files /field-kit.html =404; }

    # Preserve the published HTML bytes: its relative logo path resolves under
    # the slash aliases, so map those two browser requests to the same asset.
    location = /guide/assets/handover-icon-dark.png {
        alias /usr/share/nginx/html/assets/handover-icon-dark.png;
    }
    location = /field-kit/assets/handover-icon-dark.png {
        alias /usr/share/nginx/html/assets/handover-icon-dark.png;
    }

    location / { try_files $uri $uri/ =404; }
}
