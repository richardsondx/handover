<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" role="img" aria-label="Fleet workflow: batch of small PRs, scripted checks first, verifier on fail or sample, judge sample, auto merge gate, merge or hold">
  <rect width="1000" height="880" fill="#111118"/>
  <text x="500" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Fleet workflow</text>
  <text x="500" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#b9b3ff">One batch, from PRs to merge.</text>

  <rect x="200" y="110" width="600" height="76" rx="12" fill="#6c5ce7"/>
  <text x="500" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Batch: 20 to 50 small PRs</text>
  <text x="500" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e6e2ff">1 author agent per PR, each in its own worktree. Depth max 1, parallel. Pilot batch is 5.</text>

  <line x1="500" y1="186" x2="500" y2="212" stroke="#6c5ce7" stroke-width="3"/>
  <polygon points="500,224 490,210 510,210" fill="#6c5ce7"/>

  <rect x="200" y="224" width="600" height="76" rx="12" fill="#1e1e2a" stroke="#6c5ce7" stroke-width="2"/>
  <text x="500" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Scripted checks first: 0 agents</text>
  <text x="500" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c9c9d6">Lint, type, and tests run as a script, not an agent.</text>

  <line x1="500" y1="300" x2="500" y2="326" stroke="#6c5ce7" stroke-width="3"/>
  <polygon points="500,338 490,324 510,324" fill="#6c5ce7"/>

  <rect x="80" y="338" width="400" height="76" rx="12" fill="#1e1e2a" stroke="#e74c3c" stroke-width="2"/>
  <text x="280" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Fail or sample: verifier</text>
  <text x="280" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c9c9d6">1 verifier per failed or sampled PR.</text>

  <rect x="520" y="338" width="400" height="76" rx="12" fill="#1e1e2a" stroke="#2ecc71" stroke-width="2"/>
  <text x="720" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Judge sample: optional</text>
  <text x="720" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c9c9d6">1 judge per 10 PRs, free model, or off.</text>

  <line x1="500" y1="414" x2="500" y2="440" stroke="#6c5ce7" stroke-width="3"/>
  <polygon points="500,452 490,438 510,438" fill="#6c5ce7"/>

  <rect x="200" y="452" width="600" height="76" rx="12" fill="#1e1e2a" stroke="#6c5ce7" stroke-width="2"/>
  <text x="500" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Auto merge gate</text>
  <text x="500" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c9c9d6">Allowlist + green CI + unanimous pass.</text>

  <line x1="500" y1="528" x2="500" y2="554" stroke="#6c5ce7" stroke-width="3"/>
  <polygon points="500,566 490,552 510,552" fill="#6c5ce7"/>

  <rect x="200" y="566" width="600" height="76" rx="12" fill="#6c5ce7"/>
  <text x="500" y="596" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Merge, or hold</text>
  <text x="500" y="624" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e6e2ff">Missing one gate item blocks the merge.</text>

  <text x="500" y="686" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c9c9d6">A 50 PR batch uses up to 65 agents total, in parallel, each in its own worktree.</text>
  <text x="500" y="714" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c9c9d6">A 20 PR batch uses 22 to 32. Pilot batch is 5 PRs.</text>
  <text x="500" y="748" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#8a8a9a">Never: new features, security work, schema changes, large refactors.</text>
</svg>
